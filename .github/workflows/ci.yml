name: Contract & CI Conformance Tests

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: service/package-lock.json

      - name: Install Service Dependencies
        run: |
          cd service
          npm install

      - name: Run Tests
        run: |
          cd service
          npm test
